apiVersion: release-notes/v2
kind: feature
area: security
issue:
  - 61773
releaseNotes:
  - |
    **Added** a built-in `eks` kubeconfig auth provider so istiod can authenticate to remote Amazon EKS clusters
    with its own AWS IAM identity (IRSA or EKS Pod Identity), optionally assuming an IAM role. Tokens are signed
    in-process, so no external credential plugin, `exec`, or long-lived service account token is needed.
    Enable it with `PILOT_INSECURE_MULTICLUSTER_KUBECONFIG_OPTIONS=eks` and generate secrets with
    `istioctl create-remote-secret --auth-type=aws-iam --aws-cluster-name=<name> [--aws-region=<region>] [--aws-role-arn=<arn>]`.
  - |
    **Fixed** `istioctl create-remote-secret --auth-plugin-config` being ignored.
